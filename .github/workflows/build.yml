name: Build Hawk-wireless
on: [push, pull_request, workflow_dispatch]

# 1. Hier geben wir dem GitHub-Bot offiziell Lese-Rechte auf den Code
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 2. Hier übergeben wir das Token an ALLE Skripte und West-Befehle im Job
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    container:
      image: zmkfirmware/zmk-build-arm:4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Zwingt den Bot, das interne Token zu nutzen

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update
      - name: West Zephyr Export
        run: west zephyr-export
      - name: Set short SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Left
        run: west build -s zmk/app -b nice_nano//zmk -- -DSHIELD="hawk_left" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Save Left
        run: cp build/zephyr/zmk.uf2 hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
      - name: Build Right
        run: west build -p -s zmk/app -b nice_nano//zmk -- -DSHIELD="hawk_right" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Save Right
        run: cp build/zephyr/zmk.uf2 hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 'hawk-${{ github.run_number }}-${{ github.sha }}'
          path: |
            hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
            hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
