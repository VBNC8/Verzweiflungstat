name: Build Hector-wireless
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update
      - name: West Zephyr Export
        run: west zephyr-export
      - name: Set short SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Left
        run: west build -s zmk/app -b nice_nano//zmk -- -DSHIELD="supermini_split_left" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Save Left
        run: cp build/zephyr/zmk.uf2 hector-wireless-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
      - name: Build Right
        run: west build -p -s zmk/app -b nice_nano//zmk -- -DSHIELD="supermini_split_right" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Save Right
        run: cp build/zephyr/zmk.uf2 hector-wireless-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hector-wireless-firmware-${{ steps.vars.outputs.SHA_SHORT }}
          path: |
            hector-wireless-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
            hector-wireless-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
