name: Build Hawk-wireless
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    container:
      image: zmkfirmware/zmk-build-arm:4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure Git Local URL
        run: |
          git config --global url."${GITHUB_WORKSPACE}/".insteadOf "https://github.com/VBNC8/Verzweiflungstat/"
          git config --global url."${GITHUB_WORKSPACE}".insteadOf "https://github.com/VBNC8/Verzweiflungstat"

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update
        
      - name: West Zephyr Export
        run: west zephyr-export
        
      - name: Set short SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        
      - name: Build Left
        run: west build -s zmk/app -b nice_nano//zmk -- -DSHIELD="hawk_left" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_KEYBOARD_NAME="\"Hawk-${{ steps.vars.outputs.SHA_SHORT }}\""
        
      - name: Save Left
        run: |
          cp build/zephyr/zmk.uf2 hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
          cp build/zephyr/zmk.bin hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.bin
        
      - name: Build Right
        run: west build -p -s zmk/app -b nice_nano//zmk -- -DSHIELD="hawk_right" -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_KEYBOARD_NAME="\"Hawk-${{ steps.vars.outputs.SHA_SHORT }}\""
        
      - name: Save Right
        run: |
          cp build/zephyr/zmk.uf2 hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
          cp build/zephyr/zmk.bin hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.bin

      # JETZT HOLEN WIR UNS DAS MODERNE GO-TOOL OHNE PYTHON-STRESS
      - name: Install nrfutil-go & Generate Packages
        run: |
          # 1. Tool direkt als fertige Linux-Binary herunterladen
          curl -sSLO https://github.com/muresan/nrfutil-go/releases/latest/download/nrfutil-go-linux-amd64
          chmod +x nrfutil-go-linux-amd64
          mv nrfutil-go-linux-amd64 /usr/local/bin/nrfutil-go
          
          # 2. Die DFU-Pakete für Links und Rechts schreiben
          nrfutil-go pkg generate --hw-version 52 --sd-req 0x00 --app-version 1 --application hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.bin hawk-left-dfu.zip
          nrfutil-go pkg generate --hw-version 52 --sd-req 0x00 --app-version 1 --application hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.bin hawk-right-dfu.zip
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 'hawk-${{ github.run_number }}-${{ github.sha }}'
          path: |
            hawk-left-${{ steps.vars.outputs.SHA_SHORT }}.uf2
            hawk-left-dfu.zip
            hawk-right-${{ steps.vars.outputs.SHA_SHORT }}.uf2
            hawk-right-dfu.zip
