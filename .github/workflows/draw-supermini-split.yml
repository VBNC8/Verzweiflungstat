name: Draw splitkb Aurora Corne keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "keymap-drawer/supermini_split.yaml"
      - "config/keymap_drawer.config.yaml"
      - ".github/workflows/draw-supermini-split.yml"
      - "keymap-drawer/layout.json"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/supermini_split.yaml > keymap-drawer/supermini_split.svg

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/supermini_split.yaml keymap-drawer/supermini_split.svg
          git commit -m "Automated keymap draw for splitkb Aurora Corne" || exit 0
          git pull --rebase
          git push
