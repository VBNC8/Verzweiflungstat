name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/splitkb_aurora_corne.keymap"
      - "config/keymap_drawer.config.yaml"
      - "keymap-drawer/keymap.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          # 1. Parsen (erzeugt raw_keymap.yaml mit 42 Tasten)
          keymap -c config/keymap_drawer.config.yaml parse -z config/splitkb_aurora_corne.keymap > raw_keymap.yaml
          
          python3 - <<EOF
          import yaml

          with open('raw_keymap.yaml', 'r') as f:
              data = yaml.safe_load(f)

          # Layout-Wechsel auf das schmale 3x5_3 Layout
          data['layout'] = {'qmk_keyboard': 'crkbd/rev1', 'qmk_layout': 'LAYOUT_split_3x5_3'}

          # Hardware/BT-Combos ausblenden (Positionspaare im 42-Tasten layout)
          # combo_bt0 (26, 20), combo_bt1 (26, 14), combo_bt2 (26, 13), combo_usb (26, 15)
          bt_usb_positions = [{26, 20}, {26, 14}, {26, 13}, {26, 15}]
          if 'combos' in data:
              data['combos'] = [c for c in data['combos'] if set(c.get('p', [])) not in bt_usb_positions]

          # Definition der zu löschenden Indizes (äußere Spalten der 42er-Keymap)
          deleted_indices = [0, 11, 12, 23, 24, 35]

          # 2. Layer-Tasten löschen (42 -> 36 Tasten)
          layers = data.get('layers', {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              for idx in sorted(deleted_indices, reverse=True):
                  if len(keys_list) > idx:
                      keys_list.pop(idx)

          # 3. EC11-Encoder-Taste (linker Daumen, im 36er Layout an Index 30) als Kreis darstellen
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              if len(keys_list) > 30:
                  key = keys_list[30]
                  if isinstance(key, dict):
                      key['type'] = 'round'
                  else:
                      keys_list[30] = {'t': str(key), 'type': 'round'}

          # 4. verbleibende Combos auf das 36er Layout umrechnen
          if 'combos' in data:
              for combo in data['combos']:
                  new_positions = []
                  for pos in combo['p']:
                      offset = sum(1 for d in deleted_indices if d < pos)
                      new_positions.append(pos - offset)
                  combo['p'] = new_positions

          import os
          os.makedirs('keymap-drawer', exist_ok=True)
          with open('keymap-drawer/keymap.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          EOF

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > keymap-drawer/splitkb_aurora_corne.svg

      - name: Validate SVG XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = "keymap-drawer/splitkb_aurora_corne.svg"
          ET.parse(p)
          print(f"SVG XML OK: {p}")
          PY

      - name: Debug SVG content (embedded refs / escaping)
        run: |
          f="keymap-drawer/splitkb_aurora_corne.svg"
          echo "File info:"
          ls -lah "$f"
          echo
          echo "Potentially problematic patterns:"
          grep -n "data:image" "$f" || true
          grep -n "xlink:href\\|href=" "$f" || true
          grep -n "\\\\\\\\" "$f" || true
          echo
          echo "First 80 lines:"
          sed -n '1,80p' "$f"
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml keymap-drawer/splitkb_aurora_corne.svg
          git commit -m "Automated 3x5_3 crop and draw fix" || exit 0
          git push
