name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/supermini_split.keymap"
      - "config/keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          # Parse supermini_split keymap.
          #
          # Firmware position layout (ZMK BLE split, 45 keys):
          #   Left alpha   : pos  0–14  (central, 15 keys)
          #   Left thumbs  : pos 15–17  (central,  3 keys)
          #   Special      : pos 18–26  (central,  9 keys — BT sel + 5-way nav)
          #   Right alpha  : pos 27–41  (peripheral offset 27, 15 keys)
          #   Right thumbs : pos 42–44  (peripheral, 3 keys)
          #
          # Desired logical draw order (30 alpha / 6 thumbs / 9 special):
          #   Draw  0– 4 ← fw  0– 4  (left  row 1)
          #   Draw  5– 9 ← fw  5– 9  (left  row 2)
          #   Draw 10–14 ← fw 10–14  (left  row 3)
          #   Draw 15–17 ← fw 15–17  (left  thumbs)
          #   Draw 18–22 ← fw 27–31  (right row 1)   ← stripped-and-shifted from fw+27
          #   Draw 23–27 ← fw 32–36  (right row 2)
          #   Draw 28–32 ← fw 37–41  (right row 3)
          #   Draw 33–35 ← fw 42–44  (right thumbs)
          #   (special pos 18–26 excluded; keymap-drawer uses LAYOUT_split_3x5_3)
          #
          # The draw positions 0–35 map to crkbd LAYOUT_split_3x5_3:
          #   0–14 left half, 15–17 left thumbs, 18–32 right half, 33–35 right thumbs.

          keymap -c config/keymap_drawer.config.yaml parse -z config/supermini_split.keymap > raw_keymap.yaml

          python3 - <<'PYEOF'
          import yaml, os

          with open('raw_keymap.yaml', 'r') as f:
              data = yaml.safe_load(f)

          # Use crkbd split-3x5+3 layout (36 keys: left half then right half)
          data['layout'] = {'qmk_keyboard': 'crkbd/rev1', 'qmk_layout': 'LAYOUT_split_3x5_3'}

          # ------------------------------------------------------------------
          # Firmware → draw position mapping.
          # Draw positions 0–35 must follow crkbd LAYOUT_split_3x5_3:
          #   left rows 1-3 (0–14), left thumbs (15–17),
          #   right rows 1-3 (18–32), right thumbs (33–35).
          #
          # Left side keys are already in the right draw positions (0–17).
          # Right side keys (fw 27–44) need to shift down by 9 to fill draw 18–35.
          # Special keys (fw 18–26) are excluded from the SVG entirely.
          # ------------------------------------------------------------------

          # Layout boundary constants (firmware positions)
          LEFT_END      = 17   # last left-side key (inclusive)
          SPECIAL_START = 18   # first special key
          SPECIAL_END   = 26   # last  special key
          RIGHT_START   = 27   # first right-side peripheral key
          RIGHT_END     = 44   # last  right-side peripheral key
          RIGHT_OFFSET  =  9   # subtract to map right fw→draw positions

          def fw_to_draw(fw_pos):
              if 0 <= fw_pos <= LEFT_END:
                  return fw_pos                    # left alpha + thumbs: unchanged
              if RIGHT_START <= fw_pos <= RIGHT_END:
                  return fw_pos - RIGHT_OFFSET     # right side: shift to draw 18–35
              return None                          # special (18–26): excluded

          # Remap every layer's key list
          layers = data.get('layers', {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              # Collect draw-ordered keys (0–35), skip special slots
              draw_keys = [None] * 36
              for fw_idx, binding in enumerate(keys_list):
                  draw_idx = fw_to_draw(fw_idx)
                  if draw_idx is not None:
                      draw_keys[draw_idx] = binding
              # Replace layer content with the reordered 36-key list
              if isinstance(layer, list):
                  layer.clear()
                  layer.extend(draw_keys)
              else:
                  layer['keys'] = draw_keys

          # Mark encoder button (left thumb 1, draw position 15) as round
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              if len(keys_list) > 15:
                  key = keys_list[15]
                  if isinstance(key, dict):
                      key['type'] = 'round'
                  else:
                      keys_list[15] = {'t': str(key), 'type': 'round'}

          # ------------------------------------------------------------------
          # Remap combo positions fw→draw.
          # Drop combos that involve any special key (fw 18–26) since those
          # keys are not shown in the SVG.
          # ------------------------------------------------------------------
          if 'combos' in data:
              remapped = []
              for combo in data['combos']:
                  draw_positions = [fw_to_draw(p) for p in combo['p']]
                  if None in draw_positions:
                      continue   # skip combos touching special positions
                  combo['p'] = draw_positions
                  remapped.append(combo)
              data['combos'] = remapped

          os.makedirs('keymap-drawer', exist_ok=True)
          with open('keymap-drawer/keymap.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          PYEOF

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > keymap-drawer/supermini_split.svg

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml keymap-drawer/supermini_split.svg
          git commit -m "Automated keymap draw for supermini_split" || exit 0
          git push
