name: Draw ZMK keymaps 
on:
  workflow_dispatch:
  push:
    paths:
      - "config/hawk.keymap"
      - "config/keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
      - "keymap-drawer/layout.json"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          # Parse hawk keymap.
          #
          # Firmware position layout (ZMK BLE split, 36 keys):
          #   Left half   : pos  0–17  (central, 18 keys)
          #   Right half  : pos 18–35  (peripheral offset 18, 18 keys)
          #
          # crkbd LAYOUT_split_3x5_3 numbers keys row-by-row across both halves,
          # so a reorder step is needed before passing to keymap-drawer.

          # keymap-drawer's get_array regex expects "key-positions" (hyphen).
          # The keymap source uses "key_positions" (underscore), so normalise
          # to a temp copy before parsing.
          sed 's/key_positions/key-positions/g' config/hawk.keymap > /tmp/hawk_normalized.keymap
          keymap -c config/keymap_drawer.config.yaml parse -z /tmp/hawk_normalized.keymap > raw_keymap.yaml

          python3 - <<'PYEOF'
          import yaml, os

          with open('raw_keymap.yaml', 'r') as f:
              data = yaml.safe_load(f)

          # Use custom layout.json: crkbd 5×3+3 with Alps circle (37 keys, pos 36 = circle).
          data['layout'] = {'qmk_info_json': 'keymap-drawer/layout.json', 'qmk_layout': 'LAYOUT'}

          # Firmware stores keys left-half-first (pos 0-17 left, 18-35 right).
          # Custom layout numbers keys row-by-row across both halves:
          #   QMK  0- 4 = fw  0- 4  (left  top row)
          #   QMK  5- 9 = fw 18-22  (right top row)
          #   QMK 10-14 = fw  5- 9  (left  mid row)
          #   QMK 15-19 = fw 23-27  (right mid row)
          #   QMK 20-24 = fw 10-14  (left  bot row)
          #   QMK 25-29 = fw 28-32  (right bot row)
          #   QMK 30-32 = fw 15-17  (left  thumbs)
          #   QMK 33-35 = fw 33-35  (right thumbs)
          #   QMK 36    = Alps nav circle (appended per layer)
          FW_TO_QMK = [
               0,  1,  2,  3,  4,   # left  top row  → QMK  0- 4
              18, 19, 20, 21, 22,   # right top row  → QMK  5- 9
               5,  6,  7,  8,  9,   # left  mid row  → QMK 10-14
              23, 24, 25, 26, 27,   # right mid row  → QMK 15-19
              10, 11, 12, 13, 14,   # left  bot row  → QMK 20-24
              28, 29, 30, 31, 32,   # right bot row  → QMK 25-29
              15, 16, 17,           # left  thumbs   → QMK 30-32
              33, 34, 35,           # right thumbs   → QMK 33-35
          ]

          # Alps 5-way encoder circle: t=center(↵), s=↑↓, h=←→.
          # Encoder CW/CCW labels appended to s field (layer-specific).
          NAV_BASE = {
            't': '<span style="white-space: nowrap;">⏮ ⏯ ⏭</span>', 
            's': '↑', 
            'h': ' ↓', 
            'type': 'round'
          }
          ENCODER_LABELS = {
              'default_layer': {'s': '🔊 🔉'},
              'lower_layer':   {'s': '⇤ ⇥'},
              'raise_layer':   {'s': '↑ ↓'},
              'adjust_layer':  {'s': '⟲ ⟳'},
          }

          layers = data.get('layers', {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              if len(keys_list) != 36:
                  continue
              # 1. Reorder from firmware order to QMK row-by-row order.
              reordered = [keys_list[i] for i in FW_TO_QMK]
              # 2. Mark encoder push button (QMK pos 30 = fw pos 15) as round.
              key = reordered[30]
              if isinstance(key, dict):
                  key['type'] = 'round'
              else:
                  reordered[30] = {'t': str(key), 'type': 'round'}
              # 3. Append Alps nav circle as key 36.
              enc = ENCODER_LABELS.get(name, {})
              reordered.append({**NAV_BASE, **enc})
              if isinstance(layer, list):
                  data['layers'][name] = reordered
              else:
                  layer['keys'] = reordered

          # Remap combo key-positions from firmware order to QMK row-by-row order,
          # and drop BT-switcher combos (X = firmware pos 11) and
          # 5-way-nav combos (Q = firmware pos 0 paired with bot-left 10-14).
          FW_POS_TO_QMK_POS = [
               0,  1,  2,  3,  4,   # fw  0- 4 → qmk  0- 4
              10, 11, 12, 13, 14,   # fw  5- 9 → qmk 10-14
              20, 21, 22, 23, 24,   # fw 10-14 → qmk 20-24
              30, 31, 32,           # fw 15-17 → qmk 30-32
               5,  6,  7,  8,  9,   # fw 18-22 → qmk  5- 9
              15, 16, 17, 18, 19,   # fw 23-27 → qmk 15-19
              25, 26, 27, 28, 29,   # fw 28-32 → qmk 25-29
              33, 34, 35,           # fw 33-35 → qmk 33-35
          ]
          remapped_combos = []
          for combo in data.get('combos', []):
              # keymap-drawer serialises key positions under the short alias "p"
              positions = combo.get('p', combo.get('key_positions', []))
              # Skip BT-switcher (X+A/S/D/F) combos — firmware pos 11 (X key).
              if 11 in positions:
                  continue
              # Skip 5-way-nav (Q+Z/X/C/V/B) combos — firmware pos 0 (Q key)
              # paired with bot-left (10-14) partner keys only.
              # combo_ae uses Q(0)+A(5) and must NOT be filtered out.
              NAV_PARTNERS = {10, 11, 12, 13, 14}
              if 0 in positions and any(p in NAV_PARTNERS for p in positions):
                  continue
              remapped = [FW_POS_TO_QMK_POS[pos] for pos in positions]
              if 'p' in combo:
                  combo['p'] = remapped
              else:
                  combo['key_positions'] = remapped
              remapped_combos.append(combo)
          data['combos'] = remapped_combos

          os.makedirs('keymap-drawer', exist_ok=True)
          with open('keymap-drawer/keymap.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          PYEOF

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > keymap-drawer/hawk.svg

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml keymap-drawer/hawk.svg
          git commit -m "Automated keymap draw for hawk" || exit 0
          git pull --rebase
          git push
