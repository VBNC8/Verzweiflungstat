name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/supermini_split.keymap"
      - "config/keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          # Parse supermini_split keymap.
          # The keymap has 40 positions: 0-17 left keys, 18-21 BT-switcher (special pin), 22-39 right keys.
          # For drawing we strip the 4 special positions (18-21) to get a clean 36-key 5x3+3 layout.
          keymap -c config/keymap_drawer.config.yaml parse -z config/supermini_split.keymap > raw_keymap.yaml

          python3 - <<'PYEOF'
          import yaml, os

          with open('raw_keymap.yaml', 'r') as f:
              data = yaml.safe_load(f)

          # 5x3 + 3 thumbs split layout
          data['layout'] = {'qmk_keyboard': 'crkbd/rev1', 'qmk_layout': 'LAYOUT_split_3x5_3'}

          # Remove special positions 18-21 (BT-switcher) from every layer
          special_indices = list(range(18, 22))  # 4 positions

          layers = data.get('layers', {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              for idx in sorted(special_indices, reverse=True):
                  if len(keys_list) > idx:
                      keys_list.pop(idx)

          # Mark encoder button (left thumb 1, position 15) as round in all layers
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              if len(keys_list) > 15:
                  key = keys_list[15]
                  if isinstance(key, dict):
                      key['type'] = 'round'
                  else:
                      keys_list[15] = {'t': str(key), 'type': 'round'}

          # Recalculate combo positions: strip combos that touch special range,
          # then shift right-side positions (>=22) down by 4.
          if 'combos' in data:
              data['combos'] = [c for c in data['combos']
                                if not any(18 <= p <= 21 for p in c['p'])]
              for combo in data['combos']:
                  combo['p'] = [p if p < 18 else p - 4 for p in combo['p']]

          os.makedirs('keymap-drawer', exist_ok=True)
          with open('keymap-drawer/keymap.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          PYEOF

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > keymap-drawer/supermini_split.svg

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml keymap-drawer/supermini_split.svg
          git commit -m "Automated keymap draw for supermini_split" || exit 0
          git push
