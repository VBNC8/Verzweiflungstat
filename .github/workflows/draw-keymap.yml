name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/hawk.keymap"
      - "config/keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
      - "keymap-drawer/layout.json"

jobs:
  draw:
    runs-on: ubuntu-latest
    env:
      SVG_OUT: keymap-drawer/hawk.svg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          sed 's/key_positions/key-positions/g' config/hawk.keymap > /tmp/hawk_normalized.keymap
          keymap -c config/keymap_drawer.config.yaml parse -z /tmp/hawk_normalized.keymap > raw_keymap.yaml

          python3 - <<'PYEOF'
          import yaml, os

          with open('raw_keymap.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          data['layout'] = {'qmk_info_json': 'keymap-drawer/layout.json', 'qmk_layout': 'LAYOUT'}

          FW_TO_QMK = [
               0,  1,  2,  3,  4,
              18, 19, 20, 21, 22,
               5,  6,  7,  8,  9,
              23, 24, 25, 26, 27,
              10, 11, 12, 13, 14,
              28, 29, 30, 31, 32,
              15, 16, 17,
              33, 34, 35,
          ]

          NAV_BASE = {'t': '⏮·⏯·⏭', 's': '↑', 'h': '↓', 'type': 'round'}
          ENCODER_LABELS = {
              'default_layer': {'s': '🔊 🔉'},
              'lower_layer':   {'s': '⇤ ⇥'},
              'raise_layer':   {'s': '↑ ↓'},
              'adjust_layer':  {'s': '⟲ ⟳'},
          }

          layers = data.get('layers', {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get('keys', [])
              if len(keys_list) != 36:
                  continue
              reordered = [keys_list[i] for i in FW_TO_QMK]
              key = reordered[30]
              if isinstance(key, dict):
                  key['type'] = 'round'
              else:
                  reordered[30] = {'t': str(key), 'type': 'round'}
              enc = ENCODER_LABELS.get(name, {})
              reordered.append({**NAV_BASE, **enc})
              if isinstance(layer, list):
                  data['layers'][name] = reordered
              else:
                  layer['keys'] = reordered

          FW_POS_TO_QMK_POS = [
               0,  1,  2,  3,  4,
              10, 11, 12, 13, 14,
              20, 21, 22, 23, 24,
              30, 31, 32,
               5,  6,  7,  8,  9,
              15, 16, 17, 18, 19,
              25, 26, 27, 28, 29,
              33, 34, 35,
          ]

          remapped_combos = []
          for combo in data.get('combos', []):
              positions = combo.get('p', combo.get('key_positions', []))
              if 11 in positions:
                  continue
              NAV_PARTNERS = {10, 11, 12, 13, 14}
              if 0 in positions and any(p in NAV_PARTNERS for p in positions):
                  continue
              remapped = [FW_POS_TO_QMK_POS[pos] for pos in positions]
              if 'p' in combo:
                  combo['p'] = remapped
              else:
                  combo['key_positions'] = remapped
              remapped_combos.append(combo)
          data['combos'] = remapped_combos

          os.makedirs('keymap-drawer', exist_ok=True)
          with open('keymap-drawer/keymap.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          PYEOF

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > "$SVG_OUT"

      - name: Sanitize SVG style comments
        run: |
          python3 - <<'PY'
          import os, re

          p = os.environ["SVG_OUT"]
          with open(p, "r", encoding="utf-8", errors="replace") as f:
              svg = f.read()

          def fix_comment(m):
              c = m.group(1)
              c = c.replace("—", "-").replace("–", "-")
              c = c.replace("&", "and")
              return f"/*{c}*/"

          svg = re.sub(r"/\*(.*?)\*/", fix_comment, svg, flags=re.S)

          with open(p, "w", encoding="utf-8") as f:
              f.write(svg)

          print("Sanitized style comments in", p)
          PY

      - name: Validate SVG XML (with context)
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          p = os.environ["SVG_OUT"]
          try:
              ET.parse(p)
              print(f"SVG XML OK: {p}")
          except ET.ParseError as e:
              print(f"SVG XML ParseError: {e}")
              line_no, col = getattr(e, "position", (None, None))
              if line_no is not None:
                  with open(p, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.readlines()
                  start = max(1, line_no - 2)
                  end = min(len(lines), line_no + 2)
                  print(f"\nContext ({start}-{end}):")
                  for i in range(start, end + 1):
                      txt = lines[i - 1].rstrip("\n")
                      print(f"{i:>5}: {txt}")
                      if i == line_no:
                          print("       " + " " * col + "^")
              raise
          PY

      - name: Debug SVG around previous failure area
        if: always()
        run: |
          f="$SVG_OUT"
          echo "File info:"
          ls -lah "$f" || true
          echo
          echo "Lines 160-175:"
          nl -ba "$f" | sed -n '160,175p' || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml "$SVG_OUT"
          git commit -m "Automated keymap draw for hawk (SVG sanitize + validate)" || exit 0
          git pull --rebase
          git push
