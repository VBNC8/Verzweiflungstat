name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "config/splitkb_aurora_corne.keymap"
      - "config/keymap_drawer.config.yaml"
      - "keymap-drawer/keymap.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    runs-on: ubuntu-latest
    env:
      SVG_OUT: keymap-drawer/splitkb_aurora_corne.svg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install tree-sitter==0.21.3 keymap-drawer PyYAML

      - name: Parse and Transform
        run: |
          # 1) Parse (produces raw_keymap.yaml with 42 keys)
          keymap -c config/keymap_drawer.config.yaml parse -z config/splitkb_aurora_corne.keymap > raw_keymap.yaml

          python3 - <<'PY'
          import os
          import yaml

          with open("raw_keymap.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          # Switch to narrow 3x5_3 layout
          data["layout"] = {
              "qmk_keyboard": "crkbd/rev1",
              "qmk_layout": "LAYOUT_split_3x5_3"
          }

          # Hide hardware/BT combos in 42-key layout
          # combo_bt0 (26,20), combo_bt1 (26,14), combo_bt2 (26,13), combo_usb (26,15)
          bt_usb_positions = [{26, 20}, {26, 14}, {26, 13}, {26, 15}]
          if "combos" in data:
              data["combos"] = [
                  c for c in data["combos"]
                  if set(c.get("p", [])) not in bt_usb_positions
              ]

          # Indices to delete (outer columns of 42-key keymap)
          deleted_indices = [0, 11, 12, 23, 24, 35]

          # 2) Delete layer keys (42 -> 36)
          layers = data.get("layers", {})
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get("keys", [])
              for idx in sorted(deleted_indices, reverse=True):
                  if len(keys_list) > idx:
                      keys_list.pop(idx)

          # 3) Mark EC11 encoder key (left thumb, index 30 in 36-key layout) as round
          for name, layer in layers.items():
              keys_list = layer if isinstance(layer, list) else layer.get("keys", [])
              if len(keys_list) > 30:
                  key = keys_list[30]
                  if isinstance(key, dict):
                      key["type"] = "round"
                  else:
                      keys_list[30] = {"t": str(key), "type": "round"}

          # 4) Remap remaining combo positions to 36-key layout
          if "combos" in data:
              for combo in data["combos"]:
                  positions = combo.get("p", [])
                  new_positions = []
                  for pos in positions:
                      offset = sum(1 for d in deleted_indices if d < pos)
                      new_positions.append(pos - offset)
                  combo["p"] = new_positions

          os.makedirs("keymap-drawer", exist_ok=True)
          with open("keymap-drawer/keymap.yaml", "w", encoding="utf-8") as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)
          PY

      - name: Sanitize keymap text for SVG/XML
        run: |
          python3 - <<'PY'
          import yaml
          from xml.sax.saxutils import escape

          PATH = "keymap-drawer/keymap.yaml"

          def esc(v):
              if isinstance(v, str):
                  return escape(v, {"'": "&apos;", '"': "&quot;"})
              return v

          def walk(obj):
              if isinstance(obj, dict):
                  out = {}
                  for k, v in obj.items():
                      # Escape common display text fields keymap-drawer uses
                      if k in {"t", "h", "s", "r", "m", "label"} and isinstance(v, str):
                          out[k] = esc(v)
                      else:
                          out[k] = walk(v)
                  return out
              if isinstance(obj, list):
                  return [walk(x) for x in obj]
              return obj

          with open(PATH, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          data = walk(data)

          with open(PATH, "w", encoding="utf-8") as f:
              yaml.dump(data, f, sort_keys=False, allow_unicode=True)

          print("Sanitized:", PATH)
          PY

      - name: Draw SVG
        run: |
          keymap -c config/keymap_drawer.config.yaml draw keymap-drawer/keymap.yaml > "$SVG_OUT"

      - name: Validate SVG XML (show exact error location)
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          p = os.environ["SVG_OUT"]
          try:
            ET.parse(p)
            print(f"SVG XML OK: {p}")
          except ET.ParseError as e:
            print(f"SVG XML ParseError: {e}")
            # e.position => (line, column)
            line_no, col = getattr(e, "position", (None, None))
            if line_no is not None:
              with open(p, "r", encoding="utf-8", errors="replace") as f:
                lines = f.readlines()
              start = max(1, line_no - 2)
              end = min(len(lines), line_no + 2)
              print(f"\nContext ({start}-{end}):")
              for i in range(start, end + 1):
                txt = lines[i - 1].rstrip("\n")
                print(f"{i:>5}: {txt}")
                if i == line_no:
                  print("       " + " " * col + "^")
            raise
          PY

      - name: Debug SVG content (always)
        if: always()
        run: |
          f="$SVG_OUT"
          echo "File info:"
          ls -lah "$f" || true
          echo
          echo "Potentially problematic patterns:"
          grep -n "data:image" "$f" || true
          grep -n "xlink:href\\|href=" "$f" || true
          grep -n "\\\\\\\\" "$f" || true
          echo
          echo "Lines 150-180 (around previous parse error):"
          nl -ba "$f" | sed -n '150,180p' || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/keymap.yaml "$SVG_OUT"
          git commit -m "Automated 3x5_3 crop and draw fix" || exit 0
          git push
