CONFIG_ZMK_USB_BOOT=y

# --- ENCODER ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- VERBINDUNG ---
# Standard TX-Leistung (0 dBm) statt +8 dBm spart deutlich Energie.
# Bei Verbindungsproblemen kann auf PLUS_4 oder PLUS_8 erhöht werden.
CONFIG_BT_CTLR_TX_PWR_0=y

# --- ENERGIESPAREN ---
# Nach 10 s Inaktivität BLE-Aktivität reduzieren (schneller als Standard 30 s).
CONFIG_ZMK_IDLE_TIMEOUT=10000
# Nach 5 min Inaktivität in tiefen Schlaf wechseln.
# Funktioniert nur korrekt, wenn CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
# ist (siehe unten): die dedizierte Work-Queue kann mid-SPI-Transaktion
# unterbrochen werden und friert dann das Display ein.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# --- BATTERIE ---
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- DISPLAY (nice!view) ---
CONFIG_ZMK_DISPLAY=y

# Vertikales Portrait-Layout (nice!view); ohne dieses Flag liefert
# zmk_display_status_screen() NULL → leeres Display.
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# System-Work-Queue statt dedizierter Queue: PM-Suspend kann Display sauber
# unterbrechen → kein Einfrieren im Batteriebetrieb.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
