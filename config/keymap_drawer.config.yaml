parse_config:
  raw_binding_map:
    # --- LAYER KEYS ---
    "&lt 1 TAB": {t: "⇥", h: "Lower"}
    "&lt 1 RET": {t: "↵", h: "Lower"}
    "&lt 2 ESC": {t: "ESC", h: "Raise"}
    "&lt_hp 2 SPACE": {t: "␣", h: "Raise"}
    "&kp BSPC": {t: "⌫", h: "Adjust"}
    "&mo 1": {t: "Lower", type: "held"}
    "&mo 2": {t: "Raise", type: "held"}
    "&mo 3": {h: "Adjust"}
    "&kp HOME": {t: "⤒ Pos1", type: "held"}
    "&kp END": {t: "⤓ End", type: "held"}
    "&kp LC(LS(ESC))": {t: "Task Mgr"}
    "&nbsp": {t: "&nbsp"}
    "&kp F12": {t: " ", type: "held"}
    "&kp F13": {t: " ", type: "held"}
    "&kp F14": {t: " ", type: "ghost"}

    # --- NEW LAYER KEYS (LOWER LAYER EXTRAS) ---
    "&lt 3 LG(D)": {t: "$$mdi:monitor$$", s: "Show", h: "Adjust"}
    "&lt_hp 3 BSPC": {t: "⌫", h: "Adjust"}

    "&pair_paren": "()"
    "&pair_brc": "{}"
    "&pair_bkt": "[]"

    "&kp LS(N1)": "!"
    "&kp LS(N2)": '"'
    "&kp LS(N4)": '$'
    "&kp LS(N5)": '%'
    "&kp LS(N6)": "&"
    "&kp LS(N7)": "/"
    "&kp LS(N8)": "("
    "&kp LS(N9)": ")"
    "&kp LS(N0)": "="
    "&kp LS(MINUS)": "?"
    "&kp LS(DOT)": ":"
    "&kp LS(NON_US_HASH)": "'"
    "&kp LS(BSLH)": "'"

    # --- MATH ---
    "&kp KP_PLUS": "+"
    "&kp KP_MINUS": "-"
    "&kp KP_MULTIPLY": "*"
    "&kp KP_DIVIDE": "/"
    "&kp KP_EQUAL": "="
    "&plus_minus": "±"

    # --- SYMBOLS & NAVIGATION ---
    "&kp BSPC": "⌫"
    "&kp DEL": "⌦"
    "&kp LGUI": "$$mdi:microsoft-windows-classic$$"
    "&kp LG(D)": {t: "$$mdi:monitor$$", s: "Show"}
    "&kp GRAVE": {t: "^"}
    "&kp LS(GRAVE)": {t: "°"}
    "&kp PLUS": "`"
    "&kp LS(SLASH)": "_"

    # --- NUMBERS & UMLAUTS ---
    "&kp N1": {t: "1", s: "!"}
    "&kp N2": {t: "2", s: '"'}
    "&kp N3": {t: "3", s: "§"}
    "&kp N4": {t: "4", s: "$"}
    "&kp N5": {t: "5", s: "%"}
    "&kp N6": {t: "6", s: "&"}
    "&kp N7": {t: "7", s: "/"}
    "&kp N8": {t: "8", s: "("}
    "&kp N9": {t: "9", s: ")"}
    "&kp N0": {t: "0", s: "="}
    "&kp MINUS": "ß"
    "&kp SEMI": "Ö"
    "&kp SQT": "Ä"
    "&kp LBKT": "Ü"
    "&kp RA(N7)": "{"
    "&kp RA(N8)": "["
    "&kp RA(N9)": "]"
    "&kp RA(N0)": "}"
    "&kp RA(Q)": "@"
    "&kp RA(E)": "€"
    "&kp RA(M)": "µ"
    "&kp RA(P)": "Ö"
    "&kp RA(Y)": "Ü"
    "&kp RA(SQT)": "Ä"
    "&kp RA(MINUS)": "\\"
    "&kp EQUAL": "´"
    "&kp RA(NON_US_BSLH)": "|"
    "&kp RA(RBKT)": "~"
    "&kp NON_US_HASH": "#"
    "&kp NON_US_BSLH": {t: "<"}
    "&kp LS(NON_US_BSLH)": ">"
    "&kp SLASH": {t: "-"}
    "&kp RBKT": {t: "+", s: "*"}
    "&kp Q": {t: "Q", s: "@"}
    "&kp E": {t: "E", s: "€"}
    "&kp M": {t: "M", s: "µ"}

    # --- SYSTEM & BT ---
    "&usb_on": "$$mdi:usb$$"
    "&bt_sel_0": {t: "$$mdi:bluetooth$$", s: "⓵", h: "PC"}
    "&bt_sel_1": {t: "$$mdi:bluetooth$$", s: "⓶", h: "S8"}
    "&bt_sel_2": {t: "$$mdi:bluetooth$$", s: "⓷", h: "Zbook"}
    "&bt_sel_3": {t: "$$mdi:bluetooth$$", s: "⓸"}
    "&bt_sel_4": {t: "$$mdi:bluetooth$$", s: "⓹"}
    "&kp LA(F4)": {t: "✕", s: "Alt F4"}

    # --- MISC ---
    "&smiley": {t: "☻"}
    "&durchmesser": "Ø"
    "&kp C_PREV": "⏮"
    "&kp C_NEXT": "⏭"
    "&kp C_PP": {t: "⏯", type: "ghost"}

    # --- MODIFIERS ---
    "&hrm_safe LCTRL D": {t: "D", h: "CTRL"}
    "&hrm_shift LSHIFT F": {t: "F", h: "Shift"}
    "&hrm_shift RSHIFT J": {t: "J", h: "Shift"}
    "&hrm_safe RCTRL K": {t: "K", h: "CTRL"}
    "&hrm_safe LALT X": {t: "X", h: "Alt"}
    "&hrm_safe RALT DOT": {t: ".", s: "AltGr"}

    # --- BLUETOOTH & SYSTEM ---
    "&enc_bt_clr 0 0": {t: "$$mdi:bluetooth-off$$", s: "CLR 5s", type: "round"}
    "&ext_power EP_TOG": "Pwr±"
    "&ext_power EP_ON": "Pwr+"

    "&caps_wrd": "CAPS\nWORD"
    "&kp LC(LALT)": "CREO\n(C+A)"

    "&bootloader": "⟐"
    "&sys_reset": "↻"

draw_config:
  dark_mode: true
  width: 1200
  svg_extra_style: |
    svg.keymap {
      font-size: 16px;
    }
    text.tap {
      font-size: 20px;
    }
    text.combo, text.hold, text.shifted, text.left, text.right {
      font-size: 13px;
    }
    
    g.layer-default g.keypos-31 rect.key { fill: #3a7a3a; }
    g.layer-default g.keypos-32 rect.key { fill: #854747; }
    g.layer-default g.keypos-33 rect.key { fill: #854747; }
    g.layer-default g.keypos-34 rect.key { fill: #3a7a3a; }

    g.layer-lower g.keypos-30 rect.key { fill: #3a4a8a; }
    g.layer-lower g.keypos-35 rect.key { fill: #3a4a8a; }
    g.layer-lower g.keypos-31 rect.key { fill: #3a7a3a; }
    g.layer-lower g.keypos-34 rect.key { fill: #3a7a3a; }
    
    g.layer-adjust g.keypos-30 rect.key { fill: #3a4a8a; }
    g.layer-adjust g.keypos-35 rect.key { fill: #3a4a8a; }
    
    g.keypos-36 rect.key { rx: 100; ry: 100; }
