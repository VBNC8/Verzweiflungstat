# Right half (BLE peripheral)

CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=7200000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_BATTERY_REPORTING=y

# --- RGB LED WIDGET ---
# Blinks the onboard blue LED (P0.15) to show peripheral connection state.
# All three colour aliases share the same single-colour LED, so the widget
# blinks blue for every state.  The blink pattern distinguishes states:
#   connected:    1 long blink
#   disconnected: 3 rapid blinks
# (colour differentiation requires an external RGB LED on three separate GPIOs.)
CONFIG_RGBLED_WIDGET=y
