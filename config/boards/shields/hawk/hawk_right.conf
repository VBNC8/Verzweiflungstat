# Right half (BLE peripheral)

CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=7200000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_BATTERY_REPORTING=y

# --- RGB LED WIDGET ---
# Blinks on peripheral side to show whether the central is connected (blue) or
# disconnected (blue) using the onboard blue LED (P0.15).
CONFIG_RGBLED_WIDGET=y
