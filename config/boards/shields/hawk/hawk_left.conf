# Left half (BLE central)

CONFIG_ZMK_USB_BOOT=y

# --- ENCODER ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- BLE ---
# TX power: 0 dBm saves battery; raise to PLUS_4/PLUS_8 if range is poor
CONFIG_BT_CTLR_TX_PWR_0=y
# GATT subscription fix: prevents ZMK from dropping HID reports after reconnect
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- POWER SAVING ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=7200000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# --- BATTERY ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- LOGGING FOR HRM ANALYSIS ---
CONFIG_ZMK_USB_LOGGING=y

# Hardware-Treiber erzwingen
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# USB-Stack aktivieren
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
