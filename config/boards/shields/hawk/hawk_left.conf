# Left half (BLE central)

CONFIG_ZMK_USB_BOOT=y

# --- ENCODER ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- BLE ---
# TX power: 0 dBm saves battery; raise to PLUS_4/PLUS_8 if range is poor
CONFIG_BT_CTLR_TX_PWR_0=y
# GATT subscription fix: prevents ZMK from dropping HID reports after reconnect
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- POWER SAVING ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=7200000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# --- BATTERY ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- NEW LOGGING FOR ZMK / ZEPHYR 4.x ---
CONFIG_ZMK_USB_LOGGING=y

# Das neue USB-NEXT System aktivieren
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Serielle Konsole erzwingen
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- RGB LED WIDGET ---
# Indicates BT profile connection status via the onboard blue LED (P0.15).
# All three colour aliases share the same single-colour LED, so the widget
# blinks blue for every state.  The blink pattern distinguishes states:
#   boot:            battery blink, then profile-state blink
#   connected:       1 long blink
#   advertising:     2 shorter blinks
#   disconnected:    3 rapid blinks
# (exact patterns depend on zmk-rgbled-widget defaults; colours require an
#  external RGB LED wired to three separate GPIOs.)
CONFIG_RGBLED_WIDGET=y
