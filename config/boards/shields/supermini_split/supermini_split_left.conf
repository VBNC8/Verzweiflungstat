# Left half (BLE central)

CONFIG_ZMK_USB_BOOT=y

# --- ENCODER ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- BLE ---
# TX power: 0 dBm saves battery; raise to PLUS_4/PLUS_8 if range is poor
CONFIG_BT_CTLR_TX_PWR_0=y
# GATT subscription fix: prevents ZMK from dropping HID reports after reconnect
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- POWER SAVING ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# --- BATTERY ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

